<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Average Trader</title>
  <style>
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg,#3b0a45,#6a0dad,#b19cd9); color:#fff; margin:0; padding:0;}
    header { text-align:center; padding:20px; background-color:rgba(0,0,0,0.3);}
    h1 { margin:0; font-size:2.5em;}
    .quote { font-style:italic; margin-top:10px;}
    .dashboard { display:flex; flex-direction:column; align-items:center; padding:30px;}
    .card { background-color:rgba(255,255,255,0.1); border-radius:10px; padding:20px; margin:15px; width:95%; max-width:1000px;}
    .signal { font-weight:bold; font-size:1.2em;}
    footer { text-align:center; padding:15px; background-color:rgba(0,0,0,0.3);}
    table { width:100%; border-collapse:collapse; margin-top:10px;}
    td,th { border:1px solid rgba(255,255,255,0.3); padding:8px; text-align:center;}
  </style>
</head>
<body>
  <header>
    <h1>Your Average Trader</h1>
    <div class="quote" id="quote">"Stay disciplined, trade smart."</div>
    <div id="datetime"></div>
    <div id="marketStatus"></div>
  </header>

  <div class="dashboard">
    <!-- Live Prices -->
    <div class="card">
      <h2>📊 Live Prices</h2>
      <table>
        <thead><tr><th>Symbol</th><th>Price</th><th>Signal</th></tr></thead>
        <tbody id="pricesTable"></tbody>
      </table>
    </div>

    <!-- Pair Analysis -->
    <div class="card">
      <h2>📈 Pair Analysis</h2>
      <p>Select timeframe & mode:</p>
      <select id="timeframe">
        <option>1m</option><option>5m</option><option>15m</option>
        <option>30m</option><option>1h</option><option>4h</option><option>1d</option>
      </select>
      <select id="mode"><option>Swing</option><option>Scalp</option></select>
      <button onclick="analyzePair('XAUUSD')">Analyze Gold (XAUUSD)</button>
      <button onclick="analyzePair('R_75')">Analyze Volatility 75</button>
      <div id="analysisResult"></div>
    </div>

    <!-- AI Chart Analyzer -->
    <div class="card">
      <h2>🧠 AI Chart Analyzer</h2>
      <input type="file" id="chartUpload" />
      <button onclick="analyzeChart()">Analyze Chart</button>
      <div id="chartResult"></div>
    </div>

    <!-- Multi-Pair Scanner -->
    <div class="card">
      <h2>🔍 Multi-Pair Scanner</h2>
      <button onclick="scanAll()">Analyze All Charts</button>
      <div id="scannerResult"></div>
    </div>
  </div>

  <footer>&copy; 2026 Your Average Trader. All rights reserved.</footer>

  <script>
    // Date/time
    function updateDateTime() {
      const now = new Date();
      document.getElementById("datetime").innerText = now.toLocaleString();
    }
    setInterval(updateDateTime, 1000);

    // Market status
    function updateMarketStatus() {
      const hours = new Date().getUTCHours();
      let status = "Closed";
      if (hours >= 13 && hours <= 20) status = "US Market Open";
      else if (hours >= 7 && hours <= 15) status = "EU Market Open";
      else if (hours >= 0 && hours <= 8) status = "Asian Market Open";
      document.getElementById("marketStatus").innerText = "Market Status: " + status;
    }
    updateMarketStatus(); setInterval(updateMarketStatus, 60000);

    // Deriv WebSocket
    const token = "YOUR_API_TOKEN"; // Replace with your Deriv API token
    const ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");

    const symbols = [
      "XAUUSD",
      "R_10","R_10_1s",
      "R_25","R_25_1s",
      "R_50","R_50_1s",
      "R_75","R_75_1s",
      "R_100","R_100_1s"
    ];

    ws.onopen = () => {
      ws.send(JSON.stringify({ authorize: token }));
      symbols.forEach(sym => {
        ws.send(JSON.stringify({ ticks: sym, subscribe: 1 }));
        addRow(sym);
      });
    };

    ws.onmessage = (msg) => {
      const data = JSON.parse(msg.data);
      if (data.tick) {
        const sym = data.tick.symbol;
        const price = data.tick.quote;
        const cell = document.getElementById("price_" + sym);
        if (cell) cell.innerText = price;
        // Run signal engine
        const signalCell = document.getElementById("signal_" + sym);
        if (signalCell) signalCell.innerText = generateSignal(price);
      }
    };

    function addRow(sym) {
      const row = document.createElement("tr");
      row.innerHTML = `<td>${sym}</td><td id="price_${sym}">Loading...</td><td id="signal_${sym}">Waiting...</td>`;
      document.getElementById("pricesTable").appendChild(row);
    }

    // Basic signal engine (placeholder logic)
    function generateSignal(price) {
      // Replace with EMA/MACD calculations
      if (price % 2 === 0) return "BUY — EMA bullish";
      else return "SELL — MACD bearish";
    }

    // Pair analysis
    function analyzePair(pair) {
      const tf = document.getElementById("timeframe").value;
      const mode = document.getElementById("mode").value;
      document.getElementById("analysisResult").innerHTML =
        `<p class='signal'>${pair} (${tf}, ${mode}): WAIT — Need confirmation from EMA & MACD.</p>`;
    }

    // AI Chart Analyzer (placeholder)
    function analyzeChart() {
      document.getElementById("chartResult").innerText =
        "AI Analysis: Trend bullish, entry slightly early. Wait for MACD confirmation.";
    }

    // Multi-Pair Scanner
    function scanAll() {
      document.getElementById("scannerResult").innerText =
        "Scanner found setups: XAUUSD (BUY), R_50 (SELL), R_100_1s (WAIT). Full breakdown pending.";
    }
  </script>
</body>
</html>
